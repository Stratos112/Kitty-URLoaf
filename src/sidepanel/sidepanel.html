<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pants</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #1a1a2e; }
    body { display: flex; flex-direction: column; }

    #pants {
      margin-top: auto;
      width: 130%;
      aspect-ratio: 3615 / 2650;
      position: relative;
    }

    #pants > div {
      position: absolute;
      inset: 0;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: top left;
    }

    .l1 { z-index: 1; background-image: url('../../static/Pants/Limbs/left_back_paw.png');  }
    .l2 { z-index: 2; background-image: url('../../static/Pants/Limbs/left_front_paw.png'); }
    .l3 { z-index: 3; background-image: url('../../static/Pants/Anim/breath.apng');         }
    .l4 { z-index: 4; background-image: url('../../static/Pants/Limbs/right_back_paw.png'); }
    .l5 { z-index: 5; background-image: url('../../static/Pants/Anim/breath-rpaw.apng');    }
    .l6 { z-index: 6; background-image: url('../../static/Pants/Anim/tail-flick.apng');     }
    .l7 { z-index: 7; background-image: url('../../static/Pants/Anim/breath-head.apng');    }
    .l8 { z-index: 8; background-image: url('../../static/Pants/Anim/breath-eyes.apng');    }
    .l9 { z-index: 9; background-image: url('../../static/Pants/Anim/blink-overlay.apng'); }
  </style>
</head>
<body>
<div id="pants">
  <div class="l1"></div>
  <div class="l2"></div>
  <div class="l3"></div>
  <div class="l4"></div>
  <div class="l5"></div>
  <div class="l6"></div>
  <div class="l7"></div>
  <div class="l8"></div>
  <div class="l9"></div>
</div>
<script>
  const l7 = document.querySelector('.l7');
  const l8 = document.querySelector('.l8');
  const l9 = document.querySelector('.l9');

  const HOLD_MS  = 10000;
  const TRANS_MS = 1500;
  const FRAME_COUNT = 30;
  const FRAME_MS = TRANS_MS / FRAME_COUNT;

  const AWAKE_HEAD = "url('../../static/Pants/Anim/breath-head.apng')";
  const AWAKE_EYES = "url('../../static/Pants/Anim/breath-eyes.apng')";
  const BLINK      = "url('../../static/Pants/Anim/blink-overlay.apng')";
  const SLEEP_HEAD = "url('../../static/Pants/Anim/breath-head-sleep.apng')";
  const SLEEP_EYES = "url('../../static/Pants/Anim/breath-eyes-sleep.apng')";

  const TRANS = Array.from({ length: FRAME_COUNT }, (_, i) =>
    `url('../../static/Pants/Anim/Transition/frame-${String(i).padStart(2, '0')}.png')`);
  const TRANS_REV = [...TRANS].reverse();

  function setAwake()  { l7.style.backgroundImage = AWAKE_HEAD; l8.style.backgroundImage = AWAKE_EYES; l9.style.backgroundImage = BLINK; }
  function setAsleep() { l7.style.backgroundImage = SLEEP_HEAD; l8.style.backgroundImage = SLEEP_EYES; l9.style.backgroundImage = 'none'; }

  function runTransition(frames, onDone) {
    l8.style.backgroundImage = 'none';
    l9.style.backgroundImage = 'none';
    let i = 0;
    (function step() {
      if (i >= frames.length) { onDone(); return; }
      l7.style.backgroundImage = frames[i++];
      setTimeout(step, FRAME_MS);
    })();
  }

  function cycle() {
    setAwake();
    setTimeout(() => runTransition(TRANS, () => {
      setAsleep();
      setTimeout(() => runTransition(TRANS_REV, cycle), HOLD_MS);
    }), HOLD_MS);
  }

  cycle();
</script>
</body>
</html>
