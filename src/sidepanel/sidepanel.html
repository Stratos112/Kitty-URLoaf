<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kitty URLoaf</title>
  <style>
    :root {
      --bg:      #2d1f40;
      --surface: #3a2850;
      --pink:    #ff44bb;
      --pink-lo: #8c1f4e;
      --glow:    rgba(255,68,187,0.28);
      --text:    #ffd6ec;
      --muted:   #9a7aaa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background:
        radial-gradient(ellipse at 40% 0%, rgba(255,68,187,0.22) 0%, transparent 65%),
        radial-gradient(ellipse at 80% 100%, rgba(120,60,180,0.15) 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }
    body { display: flex; flex-direction: column; align-items: flex-start; }

    /* ── simple placeholder ──────────────────────────────────── */
    #simple-notice {
      width: 100%; flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; gap: 10px; padding: 24px;
    }
    #simple-notice .icon  { font-size: 40px; }
    #simple-notice .title { font-size: 14px; font-weight: 700; }
    #simple-notice .sub   { font-size: 11px; color: var(--muted); line-height: 1.7; }

    /* ── debug button ────────────────────────────────────────── */
    #debugBtn {
      position: fixed; top: 10px; right: 10px;
      background: transparent;
      border: 1px solid var(--muted);
      color: var(--muted);
      border-radius: 6px; padding: 4px 10px;
      font-size: 10px; font-family: inherit; cursor: pointer;
      transition: border-color 0.15s, color 0.15s; z-index: 999;
    }
    #debugBtn:hover { border-color: var(--pink); color: var(--pink); }

    /* ── stage ───────────────────────────────────────────────── */
    #stage {
      width: 122%;
      aspect-ratio: 3615 / 2650;
      position: relative;
      margin-top: auto;
    }

    /* z-order: scene(0) < entrance-bg(1) < cat(2) < entrance-fg(10) < entrance-anim(11) */
    #scene, #pants, #entrance-bg, #entrance-fg, #entrance-anim {
      position: absolute; inset: 0;
    }
    #scene        { z-index: 0; }
    #entrance-bg  { z-index: 1;  opacity: 0; pointer-events: none;
                    background: no-repeat 50% 0% / 110% 110%; }
    #pants        { z-index: 2; }
    #entrance-fg  { z-index: 10; opacity: 0; pointer-events: none;
                    background: no-repeat 50% 0% / 110% 110%; }
    #entrance-anim { z-index: 11; opacity: 0; pointer-events: none;
                    background: no-repeat 50% 0% / 110% 110%; }

    #cush {
      position: absolute; inset: 0;
      background: url('../../static/Pants/Accessories/cushion_base.png') no-repeat top left / 100% 100%;
    }

    /* cat layers */
    #pants > div {
      position: absolute; inset: 0;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: top left;
    }

    .l1  { z-index: 1;  background-image: url('../../static/Pants/Limbs/left_back_paw.png');   }
    .l2  { z-index: 2;  background-image: url('../../static/Pants/Limbs/left_front_paw.png');  }
    .l3  { z-index: 3;  background-image: url('../../static/Pants/Anim/breath.apng');          }
    .l4  { z-index: 4;  background-image: url('../../static/Pants/Limbs/right_back_paw.png');  }
    .l5  { z-index: 5;  background-image: url('../../static/Pants/Anim/breath-rpaw.apng');     }
    .l6  { z-index: 6;  background-image: url('../../static/Pants/Anim/tail-flick.apng');      }
    .l7  { z-index: 7;  background-image: url('../../static/Pants/Anim/breath-head.apng');     }
    .l8  { z-index: 8;  background-image: url('../../static/Pants/Anim/breath-eyes.apng');     }
    .l9  { z-index: 9;  background-image: url('../../static/Pants/Anim/blink-overlay.apng');   }
    .l10 { z-index: 10; background-image: url('../../static/Pants/Anim/breath-ear-L.apng');    }
    .l11 { z-index: 11; background-image: url('../../static/Pants/Anim/breath-ear-R.apng');    }

    /* ── sleep ear drop ──────────────────────────────────────── */
    #pants.sleeping .l10,
    #pants.sleeping .l11 { transform: translateY(calc(70 / 530 * 100%)); }

  </style>
</head>
<body>

<div id="simple-notice" hidden>
  <div class="icon">🐾</div>
  <p class="title">deluxe only</p>
  <p class="sub">kitty's home panel is a deluxe feature.<br>reinstall with deluxe edition to unlock.</p>
</div>

<button id="debugBtn" hidden>↩ replay</button>

<div id="stage" hidden>
  <div id="scene">
    <div id="cush"></div>
  </div>
  <div id="entrance-bg"></div>
  <div id="pants">
    <div class="l1"></div>
    <div class="l2"></div>
    <div class="l3"></div>
    <div class="l4"></div>
    <div class="l5"></div>
    <div class="l6"></div>
    <div class="l7"></div>
    <div class="l8"></div>
    <div class="l9"></div>
    <div class="l10"></div>
    <div class="l11"></div>
  </div>
  <div id="entrance-fg"></div>
  <div id="entrance-anim"></div>
</div>

<script src="sidepanel.js"></script>
</body>
</html>
