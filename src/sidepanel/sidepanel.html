<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pants</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #1a1a2e; }
    body { display: flex; flex-direction: column; }

    #pants {
      margin-top: auto;
      width: 130%;
      aspect-ratio: 3615 / 2650;
      position: relative;
    }

    #pants > div {
      position: absolute;
      inset: 0;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: top left;
    }

    .l1 { z-index: 1; background-image: url('../../static/Pants/Limbs/left_back_paw.png');  }
    .l2 { z-index: 2; background-image: url('../../static/Pants/Limbs/left_front_paw.png'); }
    .l3 { z-index: 3; background-image: url('../../static/Pants/Anim/breath.apng');         }
    .l4 { z-index: 4; background-image: url('../../static/Pants/Limbs/right_back_paw.png'); }
    .l5 { z-index: 5; background-image: url('../../static/Pants/Anim/breath-rpaw.apng');    }
    .l6 { z-index: 6; background-image: url('../../static/Pants/Anim/tail-flick.apng');     }
    .l7 { z-index: 7; background-image: url('../../static/Pants/Anim/breath-head.apng');    }
    .l8 { z-index: 8; background-image: url('../../static/Pants/Anim/breath-eyes.apng');    }
    .l9  { z-index: 9;  background-image: url('../../static/Pants/Anim/blink-overlay.apng'); }
    .l10 { z-index: 10; background-image: url('../../static/Pants/Anim/breath-ear-L.apng'); }
    .l11 { z-index: 11; background-image: url('../../static/Pants/Anim/breath-ear-R.apng'); }

    /* matches SLEEP_DROP in generate-anims.py */
    #pants.sleeping .l10,
    #pants.sleeping .l11 { transform: translateY(70px); }

    #pants.flicking .l10 { animation: ear-flick-L 330ms linear 1 forwards; }
    #pants.flicking .l11 { animation: ear-flick-R 330ms linear 1 forwards; animation-delay: 40ms; }

    /* 6 equal 55ms slots; frame 03 (flat) occupies slots 3+4 for a held pause */
    @keyframes ear-flick-L {
      0%     { background-image: url('../../static/Pants/Anim/EarFlick/L_01.png'); animation-timing-function: step-end; }
      16.7%  { background-image: url('../../static/Pants/Anim/EarFlick/L_02.png'); animation-timing-function: step-end; }
      33.3%  { background-image: url('../../static/Pants/Anim/EarFlick/L_03.png'); animation-timing-function: step-end; }
      66.7%  { background-image: url('../../static/Pants/Anim/EarFlick/L_02.png'); animation-timing-function: step-end; }
      83.3%  { background-image: url('../../static/Pants/Anim/EarFlick/L_01.png'); animation-timing-function: step-end; }
      100%   { background-image: url('../../static/Pants/Anim/breath-ear-L.apng'); }
    }
    @keyframes ear-flick-R {
      0%     { background-image: url('../../static/Pants/Anim/EarFlick/R_01.png'); animation-timing-function: step-end; }
      16.7%  { background-image: url('../../static/Pants/Anim/EarFlick/R_02.png'); animation-timing-function: step-end; }
      33.3%  { background-image: url('../../static/Pants/Anim/EarFlick/R_03.png'); animation-timing-function: step-end; }
      66.7%  { background-image: url('../../static/Pants/Anim/EarFlick/R_02.png'); animation-timing-function: step-end; }
      83.3%  { background-image: url('../../static/Pants/Anim/EarFlick/R_01.png'); animation-timing-function: step-end; }
      100%   { background-image: url('../../static/Pants/Anim/breath-ear-R.apng'); }
    }
  </style>
</head>
<body>
<div id="pants">
  <div class="l1"></div>
  <div class="l2"></div>
  <div class="l3"></div>
  <div class="l4"></div>
  <div class="l5"></div>
  <div class="l6"></div>
  <div class="l7"></div>
  <div class="l8"></div>
  <div class="l9"></div>
  <div class="l10"></div>
  <div class="l11"></div>
</div>
<script src="sidepanel.js"></script>
</body>
</html>
