<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kitty URLoaf</title>
  <style>
    :root {
      --bg:      #120a0f;
      --surface: #1f0d18;
      --pink:    #ff44bb;
      --pink-lo: #8c1f4e;
      --glow:    rgba(255,68,187,0.22);
      --text:    #ffd6ec;
      --muted:   #7a5568;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background:
        radial-gradient(ellipse at 50% -10%, rgba(255,68,187,0.08) 0%, transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }
    body { display: flex; flex-direction: column; align-items: center; }

    /* ── simple placeholder ──────────────────────────────────── */
    #simple-notice {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; gap: 10px; padding: 24px;
    }
    #simple-notice .icon  { font-size: 40px; }
    #simple-notice .title { font-size: 14px; font-weight: 700; }
    #simple-notice .sub   { font-size: 11px; color: var(--muted); line-height: 1.7; }

    /* ── stage ───────────────────────────────────────────────── */
    #stage {
      width: 130%;
      aspect-ratio: 3615 / 2650;
      position: relative;
      margin-top: auto;
    }

    #scene, #pants, #entrance {
      position: absolute; inset: 0;
    }
    #scene    { z-index: 0; }
    #pants    { z-index: 1; }
    #entrance { z-index: 12; pointer-events: none;
                background-size: 100% 100%;
                background-repeat: no-repeat;
                background-position: top left; }

    #cush {
      position: absolute; inset: 0;
      background: url('../../static/Pants/Accessories/cushion_base.png') no-repeat top left / 100% 100%;
    }

    /* cat layers */
    #pants > div {
      position: absolute; inset: 0;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: top left;
    }

    .l1  { z-index: 1;  background-image: url('../../static/Pants/Limbs/left_back_paw.png');   }
    .l2  { z-index: 2;  background-image: url('../../static/Pants/Limbs/left_front_paw.png');  }
    .l3  { z-index: 3;  background-image: url('../../static/Pants/Anim/breath.apng');          }
    .l4  { z-index: 4;  background-image: url('../../static/Pants/Limbs/right_back_paw.png');  }
    .l5  { z-index: 5;  background-image: url('../../static/Pants/Anim/breath-rpaw.apng');     }
    .l6  { z-index: 6;  background-image: url('../../static/Pants/Anim/tail-flick.apng');      }
    .l7  { z-index: 7;  background-image: url('../../static/Pants/Anim/breath-head.apng');     }
    .l8  { z-index: 8;  background-image: url('../../static/Pants/Anim/breath-eyes.apng');     }
    .l9  { z-index: 9;  background-image: url('../../static/Pants/Anim/blink-overlay.apng');   }
    .l10 { z-index: 10; background-image: url('../../static/Pants/Anim/breath-ear-L.apng');    }
    .l11 { z-index: 11; background-image: url('../../static/Pants/Anim/breath-ear-R.apng');    }

    /* ── cat slide-in ────────────────────────────────────────── */
    #pants { transform: translateX(-110%); }
    #pants.entering {
      transition: transform 1.4s cubic-bezier(0.22, 1, 0.36, 1);
      transform: translateX(0);
    }

    /* ── sleep ear drop ──────────────────────────────────────── */
    #pants.sleeping .l10,
    #pants.sleeping .l11 { transform: translateY(calc(70 / 530 * 100%)); }

    /* ── cursor gaze zones ───────────────────────────────────── */
    #zones {
      position: absolute; inset: 0; z-index: 20;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }
    #pants:has(.tl:hover) .l8 { background-image: url('../../static/Pants/Anim/eyes-n.apng');  }
    #pants:has(.tr:hover) .l8 { background-image: url('../../static/Pants/Anim/eyes-ne.apng'); }
    #pants:has(.br:hover) .l8 { background-image: url('../../static/Pants/Anim/eyes-e.apng');  }
  </style>
</head>
<body>

<div id="simple-notice" hidden>
  <div class="icon">🐾</div>
  <p class="title">deluxe only</p>
  <p class="sub">kitty's home panel is a deluxe feature.<br>reinstall with deluxe edition to unlock.</p>
</div>

<div id="stage" hidden>
  <div id="scene">
    <div id="cush"></div>
  </div>
  <div id="pants">
    <div class="l1"></div>
    <div class="l2"></div>
    <div class="l3"></div>
    <div class="l4"></div>
    <div class="l5"></div>
    <div class="l6"></div>
    <div class="l7"></div>
    <div class="l8"></div>
    <div class="l9"></div>
    <div class="l10"></div>
    <div class="l11"></div>
    <div id="zones">
      <div class="z tl"></div>
      <div class="z tr"></div>
      <div class="z bl"></div>
      <div class="z br"></div>
    </div>
  </div>
  <div id="entrance"></div>
</div>

<script src="sidepanel.js"></script>
</body>
</html>
