<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pants</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #1a1a2e; }
    body { display: flex; flex-direction: column; }

    #pants {
      margin-top: auto;
      width: 130%;
      aspect-ratio: 3615 / 2650;
      position: relative;
    }

    #pants > div {
      position: absolute;
      inset: 0;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: top left;
      opacity: 0;
    }

    .l0 { z-index: 0; background-image: url('../../static/Pants/Accessories/cushion_base.png'); }
    .l1 { z-index: 1; background-image: url('../../static/Pants/Limbs/left_back_paw.png');  }
    .l2 { z-index: 2; background-image: url('../../static/Pants/Limbs/left_front_paw.png'); }
    .l3 { z-index: 3; background-image: url('../../static/Pants/Anim/breath.apng');         }
    .l4 { z-index: 4; background-image: url('../../static/Pants/Limbs/right_back_paw.png'); }
    .l5 { z-index: 5; background-image: url('../../static/Pants/Anim/breath-rpaw.apng');    }
    .l6 { z-index: 6; background-image: url('../../static/Pants/Anim/tail-flick.apng');     }
    .l7 { z-index: 7; background-image: url('../../static/Pants/Anim/breath-head.apng');    }
    .l8 { z-index: 8; background-image: url('../../static/Pants/Anim/breath-eyes.apng');    }
    .l9  { z-index: 9;  background-image: url('../../static/Pants/Anim/blink-overlay.apng'); }
    .l10 { z-index: 10; background-image: url('../../static/Pants/Anim/breath-ear-L.apng'); }
    .l11 { z-index: 11; background-image: url('../../static/Pants/Anim/breath-ear-R.apng'); }

    /* 70/530 of canvas height — matches SLEEP_DROP in generate-anims.py */
    #pants.sleeping .l10,
    #pants.sleeping .l11 { transform: translateY(calc(70 / 530 * 100%)); }

    /* gaze zones — 2×2 grid, each corner is a diagonal blend of its two cardinals */
    #zones {
      position: absolute; inset: 0; z-index: 20;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }

    /* GAZE_MAP["d"]: Q1→n  Q2→ne  Q3→e  Q4→base (no rule = breath-eyes.apng) */
    #pants:has(.tl:hover) .l8 { background-image: url('../../static/Pants/Anim/eyes-n.apng');  }
    #pants:has(.tr:hover) .l8 { background-image: url('../../static/Pants/Anim/eyes-ne.apng'); }
    #pants:has(.br:hover) .l8 { background-image: url('../../static/Pants/Anim/eyes-e.apng');  }
    /* .bl (Q4) intentionally omitted — falls back to breath-eyes.apng */

  </style>
</head>
<body>
<div id="pants">
  <div class="l0"></div>
  <div class="l1"></div>
  <div class="l2"></div>
  <div class="l3"></div>
  <div class="l4"></div>
  <div class="l5"></div>
  <div class="l6"></div>
  <div class="l7"></div>
  <div class="l8"></div>
  <div class="l9"></div>
  <div class="l10"></div>
  <div class="l11"></div>
  <div id="zones">
    <div class="z tl"></div>
    <div class="z tr"></div>
    <div class="z bl"></div>
    <div class="z br"></div>
  </div>
</div>
<script src="sidepanel.js"></script>
</body>
</html>
